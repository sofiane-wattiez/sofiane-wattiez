name: GitHub Metrics

on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics.yaml

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: github-metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Generate and publish public GitHub metrics
        uses: lowlighter/metrics@v3.34
        with:
          # Use the automatically renewed token for public profile data.
          token: ${{ github.token }}
          committer_token: ${{ github.token }}
          committer_branch: main
          committer_message: "Update GitHub metrics [skip ci]"
          filename: github-metrics.svg
          output_action: commit
          user: ${{ github.repository_owner }}
          template: classic
          # The workflow token only enumerates this repository. Keep profile
          # activity here; the README's stats cards cover public repositories.
          base: header, activity, community, metadata
          base_indepth: true
          config_octicon: true
          config_timezone: Europe/Paris
          config_twemoji: true
